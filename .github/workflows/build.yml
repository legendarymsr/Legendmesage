name: Build LegendMessage

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/legendmessage.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legendmessage-apk
          path: dist/legendmessage.apk
          if-no-files-found: error

      # On pushes to the default branch, publish a stable download link.
      - name: Publish to the "latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: latest
          name: LegendMessage (latest build)
          body: |
            Rolling debug build of LegendMessage from the latest commit on `main`.

            Download **legendmessage.apk** below and sideload it (arm64 devices).
            Signed with the repo's throwaway key, so builds update over each other.
            This is a build-verified, unaudited personal-use app — see the README.
          files: dist/legendmessage.apk
          make_latest: true
